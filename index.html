<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasm Speed Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .gauge-blur {
            filter: drop-shadow(0 0 25px rgba(168, 85, 247, 0.5));
        }
    </style>
</head>
<body class="bg-[#080b13] text-white min-h-screen flex flex-col items-center justify-center m-0">

    <div class="text-center max-w-md w-full px-6">
            <div class="relative w-80 h-80 mx-auto flex items-center justify-center mb-8">
            <svg class="w-full h-full gauge-blur" viewBox="0 0 100 100" style="transform: rotate(135deg);">
                <defs>
                    <linearGradient id="gauge-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#a855f7" />
                        <stop offset="100%" stop-color="#ec4899" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="45" stroke="#111827" stroke-width="8" fill="transparent" stroke-dasharray="212 283" stroke-linecap="round" />
                <circle id="progress-arc" cx="50" cy="50" r="45" stroke="url(#gauge-gradient)" stroke-width="8" fill="transparent" 
                        stroke-dasharray="212 283" stroke-dashoffset="212" stroke-linecap="round" class="transition-all duration-75 ease-out" />
            </svg>
            <div class="absolute flex flex-col items-center" style="margin-top: 10px;">
                <span id="speed-display" class="text-7xl font-light tracking-tighter">0.00</span>
                <div class="flex items-center gap-2 mt-1 text-[#a855f7]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="16 12 12 8 8 12"></polyline><line x1="12" y1="16" x2="12" y2="8"></line></svg>
                    <span class="text-sm uppercase tracking-widest font-medium">Mbps</span>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button id="start-btn" disabled class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 disabled:from-gray-800 disabled:to-gray-800 disabled:text-gray-600 text-white font-medium px-10 py-3 rounded-full cursor-pointer transition-all tracking-wide shadow-[0_0_20px_rgba(168,85,247,0.3)] disabled:shadow-none border border-white/5">
                A carregar Wasm...
            </button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const speedDisplay = document.getElementById('speed-display');
        const progressArc = document.getElementById('progress-arc');
        
        const worker = new Worker('worker.js');
        
        const maxCircumference = 212; 
        const maxExpectedSpeed = 500;

        worker.onmessage = (e) => {
            const { type, speed, message } = e.data;
            
            if (type === 'WASM_READY') {
                startBtn.disabled = false;
                startBtn.innerText = 'Iniciar Teste';
            }
            
            if (type === 'PROGRESS') {
                requestAnimationFrame(() => {
                    speedDisplay.innerText = speed.toFixed(2);
                    const percentage = Math.min(speed / maxExpectedSpeed, 1);
                    const offset = maxCircumference - (percentage * maxCircumference);
                    progressArc.style.strokeDashoffset = offset;
                });
            }
            
            if (type === 'COMPLETE') {
                startBtn.disabled = false;
                startBtn.innerText = 'Testar Novamente';
            }
            
            if (type === 'ERROR') {
                alert('Erro durante o teste de rede: ' + message);
                startBtn.disabled = false;
                startBtn.innerText = 'Iniciar Teste';
            }
        };

        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            startBtn.innerText = 'A testar...';
            speedDisplay.innerText = '0.00';
            progressArc.style.strokeDashoffset = maxCircumference;
            const testFileUrl = 'https://storage.googleapis.com/gweb-uniblog-publish-prod/documents/Interactive_2025_Annual_Report.pdf?t=' + Date.now();
            worker.postMessage({ type: 'START_DOWNLOAD', url: testFileUrl });
        });
    </script>
</body>
</html>
